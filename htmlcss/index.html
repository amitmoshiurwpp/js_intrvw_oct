<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <ul class="cards">
        <li class="card">
          <img class="card__image" src="https://picsum.photos/id/1015/600/338" alt="River running through a mountain valley" />
          <div class="card__body">
            <h2 class="card__title">Card One</h2>
            <p class="card__text">A short description for the first card.</p>
            <a class="card__link" href="#" aria-label="Read more about Card One">Read more</a>
          </div>
        </li>
        <li class="card">
          <img class="card__image" src="https://picsum.photos/id/1018/600/338" alt="Mountain landscape under a cloudy sky" />
          <div class="card__body">
            <h2 class="card__title">Card Two</h2>
            <p class="card__text">A slightly longer description for the second card to show that the buttons stay aligned at the bottom.</p>
            <a class="card__link" href="#" aria-label="Read more about Card Two">Read more</a>
          </div>
        </li>
        <li class="card">
          <img class="card__image" src="https://picsum.photos/id/1025/600/338" alt="Pug wrapped in a blanket" />
          <div class="card__body">
            <h2 class="card__title">Card Three</h2>
            <p class="card__text">A short description for the third card.</p>
            <a class="card__link" href="#" aria-label="Read more about Card Three">Read more</a>
          </div>
        </li>
      </ul>
    </main>
  </body>
</html>
